name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm rebuild better-sqlite3
      - run: pnpm check

      # One-time, bounded qualification for this repository-owned PR.
      # Fork PRs and other branches do not run browser binaries.
      - name: Install Chromium (PR 18 qualification)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 18 && github.event.pull_request.head.repo.full_name == github.repository
        timeout-minutes: 5
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser E2E (PR 18 qualification)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 18 && github.event.pull_request.head.repo.full_name == github.repository
        timeout-minutes: 5
        run: pnpm test:e2e
