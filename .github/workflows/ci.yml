name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.13.1
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm rebuild better-sqlite3
      - run: pnpm check

      # Opt-in browser qualification on trusted, same-repo PRs only.
      # Cost is bounded: no extra job, and fork PRs never run these steps.
      - name: Install Chromium (opt-in E2E)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'ci:e2e')
        timeout-minutes: 5
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser E2E (opt-in)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'ci:e2e')
        timeout-minutes: 5
        env:
          CONFIG_DRIFT_GUARD_DEMO_CAPTURE: ${{ contains(github.event.pull_request.labels.*.name, 'ci:demo-capture') && '1' || '0' }}
        run: pnpm test:e2e

      # Store actual synthetic browser footage only after an explicit two-label
      # opt-in from a same-repository PR. Never publish it as a finished demo.
      - name: Upload raw browser captures (opt-in)
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'ci:e2e') && contains(github.event.pull_request.labels.*.name, 'ci:demo-capture')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: config-drift-guard-raw-browser-captures
          path: |
            test-results/**/video.webm
            test-results/**/milestone-*.png
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
